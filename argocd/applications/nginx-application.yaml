apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-app
  namespace: argocd

spec:
  project: devops-lab

  source:
    repoURL: https://github.com/brucewayne1ua/Kubernetes-practice-and-template.git
    targetRevision: HEAD
    path: helm/nginx-chart

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true