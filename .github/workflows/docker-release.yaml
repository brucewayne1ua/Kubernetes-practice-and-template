name: Docker Release


on:

  push:

    branches:
      - main



permissions:

  contents: read

  packages: write



jobs:


  docker:


    runs-on: ubuntu-latest



    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Login to GHCR

        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      - name: Build and Push Docker image

        uses: docker/build-push-action@v5

        with:

          context: ./docker

          push: true

          tags: |

            ghcr.io/${{ github.repository_owner }}/kpractice-app:latest