name: Kubernetes Validation

on:
  push:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "helm/**"

jobs:
  kubernetes-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply \
          --dry-run=client \
          -f kubernetes/

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint
        run: |
          helm lint helm/